# Model registry. The ONLY place model IDs appear (CLAUDE.md conventions).
# Code refers to the logical keys below (`claude-sonnet`, `gemini-flash`, ...),
# never to a raw provider ID.
#
# `ids` is keyed by access path:
#   anthropic : direct Anthropic API model ID
#   vertex    : Vertex AI Model Garden ID. Current-generation Claude models use
#               the BARE first-party ID (e.g. "claude-sonnet-5"); only dated
#               snapshots take an "@YYYYMMDD" suffix. There is no vendor prefix
#               on Vertex (that is Bedrock's convention).
#
# ids_verified_on: set this after listing available models in the target project
# + region. Unset means "not yet confirmed against the live catalogue" — the
# smoke check (cli.py smoke) will surface an unknown ID loudly rather than
# silently substituting one.
# Verified by an executed round trip against every ID below, not by reading a
# docs page: project vital-octagon-19612, Claude in region `global`, Gemini in
# us-central1 (see CLAUDE_REGION in .env.example for why the two differ).
# All four returned status: ok.
ids_verified_on: 2026-08-07
#
# TWO GENERATIONS, ON PURPOSE.
# The measured campaign ran on the 2.5-class models below and those artifacts
# are the validated evidence spine; they are not re-run and not relabelled.
# The workshop's actual migration target is the current generation, so the
# registry carries both, and every rendered cell states which model produced
# it. The gated judge stays `gemini-pro` (2.5) in every generation: it was
# registered before results were seen, and an instrument that moves on freeze
# day invalidates the comparison it is there to make.
#
# The `-current` IDs below were confirmed on 2026-08-12 by executed round
# trips (`cli.py smoke --mode live --model <key>`, 6/6 ok each), not by
# reading a docs page. `ids_verified_on` above still covers the 2.5-class
# IDs; the `-current` entries carry their own confirmation in their notes,
# including the region each one had to be pinned to.

# Logical role -> model key. Swapping a model for the whole workbench is a
# one-line change here.
roles:
  claude_baseline: claude-sonnet      # the incumbent the migration is measured against
  gemini_candidate: gemini-flash      # high-volume subagent candidate
  gemini_candidate_alt: gemini-pro    # escalation rung when Flash misses a gate
  judge: gemini-pro                   # local rubric-anchored judge (the guaranteed lane)
  judge_crosscheck: claude-sonnet     # P1 dual-judge cross-check, 20% sample

models:
  claude-sonnet:
    provider: anthropic
    display_name: Claude Sonnet 5
    ids:
      anthropic: claude-sonnet-5
      vertex: claude-sonnet-5
    context_window: 1000000
    supports_json_schema: true
    supports_tools: true
    notes: >-
      Baseline for the three evaluated subagents. On Vertex, auth is GCP ADC
      (no Anthropic API key) via AnthropicVertex(project_id=..., region=...).

  claude-opus:
    provider: anthropic
    display_name: Claude Opus 5
    ids:
      anthropic: claude-opus-5
      vertex: claude-opus-5
    context_window: 1000000
    supports_json_schema: true
    supports_tools: true
    notes: >-
      Not on the Act 1 demo path. Present so a customer running Opus subagents
      can be priced without a code change.

  gemini-flash:
    provider: google
    display_name: Gemini 2.5 Flash
    ids:
      vertex: gemini-2.5-flash
    context_window: 1048576
    supports_json_schema: true
    supports_tools: true
    notes: Migration candidate for high-volume subagents.

  gemini-pro:
    provider: google
    display_name: Gemini 2.5 Pro
    ids:
      vertex: gemini-2.5-pro
    context_window: 1048576
    supports_json_schema: true
    supports_tools: true
    notes: Local judge, and the escalation rung for subagents Flash cannot carry.

  gemini-flash-current:
    provider: google
    display_name: Gemini 3.6 Flash
    ids:
      vertex: gemini-3.6-flash
    # Not served in us-central1 (404 NOT_FOUND, confirmed by a live call
    # 2026-08-12 — a metadata read resolves and is not availability). Pinned
    # here rather than by moving $REGION, so the gated judge keeps running in
    # us-central1 where it was registered.
    region: global
    context_window: 1048576
    supports_json_schema: true
    supports_tools: true
    notes: >-
      Current-generation migration target, and the only new model the
      current-generation campaign measures. Generally available — chosen over
      the 3.x preview Flash SKUs because the scorecard is a production
      migration recommendation and a preview SKU is a different claim. ID
      confirmed 2026-08-12 by an executed round trip in `global`, 6/6 ok; the
      same calls returned 404 NOT_FOUND in us-central1.

  gemini-pro-current:
    provider: google
    display_name: Gemini 3.1 Pro (preview)
    ids:
      vertex: gemini-3.1-pro-preview
    region: global
    context_window: 1048576
    supports_json_schema: true
    supports_tools: true
    notes: >-
      PREVIEW. Priced, never measured: there is no generally-available Pro past
      2.5 in this catalogue, so this entry exists to cost the escalation rung
      on the current generation and nothing else. No arm runs on it and no
      metric is attributed to it. ID confirmed 2026-08-12 by an executed round
      trip in `global`, 6/6 ok; 404 NOT_FOUND in us-central1.
