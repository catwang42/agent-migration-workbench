# Public workshop companion — https://catwang42.github.io/agent-migration-workbench/
#
# docs_dir is `site_src`, NEVER `docs/`.
# `docs/` holds internal presenter material (objection handling, the master
# plan, the decision framework) that must not be published. Changing docs_dir
# to `docs` would publish all of it in one commit. scripts/build_site.py greps
# the BUILT output for distinctive phrases from every internal file and exits
# non-zero if any of them leak.

site_name: Agent Migration Workbench
site_description: >-
  A workshop companion for migrating high-volume RAG subagents from Claude to
  Gemini on evidence: pre-registered gates, recorded calls, and a scorecard
  that is allowed to say no.
site_url: https://catwang42.github.io/agent-migration-workbench/
site_author: Agent Migration Workbench

repo_url: https://github.com/catwang42/agent-migration-workbench
repo_name: catwang42/agent-migration-workbench
edit_uri: ""

docs_dir: site_src
site_dir: site

# site_src/charts/*.md are snippet partials, not pages: each is a bare <figure>
# that pages pull in with `--8<--`. Excluding them keeps three headless,
# title-less pages out of the build and out of the search index. Snippets reads
# them off disk, so the includes still resolve.
# The leading slash anchors this to site_src/charts/. Without it the pattern is
# gitignore-style and also swallows site_src/results/charts/*.png — the notebook
# figures, which are pages' worth of real content.
exclude_docs: |
  /charts/

# Theme block ported from catwang42/skill-library-workshop mkdocs.yml: the
# Inter / JetBrains Mono pair, the slate-default palette with `primary: custom`
# so the header navy comes from extra.css tokens rather than a stock Material
# hue, and cyan as the accent. Deviations from the reference are the four
# navigation.instant/tracking features this site already had and keeps.
theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    # Slate (deep navy) is the default look; the toggle mirrors it in light.
    - scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  # Charts are generated into site_src/charts/*.md by scripts/build_site.py and
  # pulled into pages with `--8<--`, so a chart and its numbers refresh together
  # at the freeze rebuild. check_paths makes a missing partial fail the build
  # rather than render an empty figure.
  # `config` is a base path so a page can embed config/gates.yaml itself
  # instead of retyping it — a retyped threshold is a threshold that can drift
  # from the file the scorecard hashes. It is scoped to `config` rather than
  # the repo root on purpose: with `.` reachable, one `--8<--` typo could pull
  # a file out of docs/ (internal presenter material) into the public build.
  - pymdownx.snippets:
      base_path: ["site_src", "config"]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  # Required by the ported design: the hero timeline, stat tiles, module cards
  # and "before you start" notes all render :material-*: icons inline.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/catwang42/agent-migration-workbench
      name: agent-migration-workbench on GitHub
  generator: false

copyright: >-
  Every figure on this site comes from an executed model call recorded in
  <code>artifacts/replay/</code>. Corpus is synthetic (<code>demo_patents</code>,
  seed <code>20260812</code>). Cost figures render as em dashes until
  <code>config/pricing.yaml</code> is verified.

nav:
  - Home: index.md
  - Setup: setup.md
  - Modules:
      - "01 — Why subagents migrate first": modules/01-why-subagents-first.md
      - "02 — The reference workload": modules/02-reference-workload.md
      - "03 — Gates as contract": modules/03-gates-as-contract.md
      - "04 — The naive swap": modules/04-the-naive-swap.md
      - "05 — The adaptation ladder": modules/05-adaptation-ladder.md
      - "06 — The second judge": modules/06-the-second-judge.md
      - "07 — Shadow & adjudication": modules/07-shadow-and-adjudication.md
      - "08 — The scorecard": modules/08-the-scorecard.md
  - Results:
      - Overview: results/index.md
      - Migration Readiness Scorecard: results/scorecard.md
      - Selection table: results/selection_table.md
      - Judge cross-check: results/crosscheck.md
      - Charts: results/charts.md
  - Exercises: exercises.md
