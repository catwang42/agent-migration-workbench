[project]
name = "agent-migration-workbench"
version = "0.1.0"
description = "Evaluate migrating high-volume RAG subagents from Claude to Gemini"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Tests import the library from the repo root; no install step needed.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
