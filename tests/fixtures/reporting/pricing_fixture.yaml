# TEST FIXTURE — NOT REAL PRICES. NEVER COPY THESE INTO config/pricing.yaml.
#
# The economics formulae have to be exercised against *some* verified table, so
# this file supplies one made of round, obviously-synthetic numbers: exact
# powers and halves that no vendor has ever charged, chosen so that a figure
# derived from them is unmistakable in any output.
#
#   claude-sonnet input  = $10.00 / 1M     gemini-flash input  = $1.00 / 1M
#   claude-sonnet output = $20.00 / 1M     gemini-flash output = $2.00 / 1M
#   cached input is exactly 1/10 of fresh input, everywhere.
#
# verified_on is deliberately set to a date in the past century so that any
# leak of this file into a report footer is self-announcing.

verified_on: 1999-01-01
verified_by: "FIXTURE — synthetic prices for tests/test_economics.py, not vendor pricing"

sources:
  - https://example.invalid/fixture-prices-not-real

models:
  gemini-flash:  {input_per_1m: 1.0,  output_per_1m: 2.0,  cached_input_per_1m: 0.1}
  gemini-pro:    {input_per_1m: 5.0,  output_per_1m: 10.0, cached_input_per_1m: 0.5}
  claude-sonnet: {input_per_1m: 10.0, output_per_1m: 20.0, cached_input_per_1m: 1.0}
  claude-opus:   {input_per_1m: 50.0, output_per_1m: 100.0, cached_input_per_1m: 5.0}

# USD per 1M cached tokens per hour.
cache_storage:
  per_1m_token_hour: 0.5
