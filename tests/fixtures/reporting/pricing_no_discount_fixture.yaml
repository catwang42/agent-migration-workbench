# TEST FIXTURE — NOT REAL PRICES. NEVER COPY THESE INTO config/pricing.yaml.
#
# The degenerate case for amw.economics.cache_breakeven: a price table where
# the cached input rate equals the fresh input rate, so a cache read earns no
# discount and no call rate ever repays the write plus the storage rent. The
# calculator has to say "never breaks even" rather than divide by zero or emit
# an enormous breakeven figure that looks like a measurement.
#
# Same synthetic scale as pricing_fixture.yaml; only cached_input_per_1m moves.

verified_on: 1999-01-01
verified_by: "FIXTURE — synthetic prices for tests/test_economics.py, not vendor pricing"

sources:
  - https://example.invalid/fixture-prices-not-real

models:
  gemini-flash:  {input_per_1m: 1.0,  output_per_1m: 2.0,  cached_input_per_1m: 1.0}
  gemini-pro:    {input_per_1m: 5.0,  output_per_1m: 10.0, cached_input_per_1m: 5.0}
  claude-sonnet: {input_per_1m: 10.0, output_per_1m: 20.0, cached_input_per_1m: 10.0}
  claude-opus:   {input_per_1m: 50.0, output_per_1m: 100.0, cached_input_per_1m: 50.0}

cache_storage:
  per_1m_token_hour: 0.5
